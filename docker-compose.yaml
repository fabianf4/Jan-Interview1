version: "3.9"
services:
    mysql:
        image: mysql
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: test
            MYSQL_USER: test
            MYSQL_PASSWORD: test
        ports:
            - 3306:3306
        volumes:
            - ./mysql_data:/var/lib/mysql
#            - ./DB.sql:/docker-entrypoint-initdb.d/init.sql
